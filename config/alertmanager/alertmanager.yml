global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@juliaos.trading'
  resolve_timeout: 5m

route:
  group_by: ['severity', 'team']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # Critical trading alerts - immediate notification
    - match:
        severity: critical
        team: trading
      receiver: 'trading-critical'
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 10m
      
    # Platform issues - high priority
    - match:
        severity: critical
        team: platform
      receiver: 'platform-critical'
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 30m
      
    # Infrastructure alerts
    - match:
        team: infrastructure
      receiver: 'infrastructure-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      
    # Bridge connectivity issues
    - match:
        team: bridges
      receiver: 'bridge-alerts'
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 1h

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        title: 'JuliaOS Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        
  - name: 'trading-critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#trading-critical'
        title: '🚨 CRITICAL TRADING ALERT'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        color: 'danger'
        send_resolved: true
    webhook_configs:
      - url: 'http://juliaos-server:8052/api/v1/alerts/critical'
        send_resolved: true
        
  - name: 'platform-critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#platform-alerts'
        title: '⚠️ Platform Critical Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Agent/Component:* {{ .Labels.agent_id }}{{ .Labels.instance }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: 'warning'
        
  - name: 'infrastructure-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#infrastructure'
        title: 'Infrastructure Alert'
        text: |
          {{ range .Alerts }}
          *System:* {{ .Labels.instance }}
          *Issue:* {{ .Annotations.summary }}
          {{ end }}
          
  - name: 'bridge-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#bridge-alerts'
        title: 'Bridge Connectivity Alert'
        text: |
          {{ range .Alerts }}
          *Bridge:* {{ .Labels.bridge_name }}
          *Status:* {{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  # Suppress non-critical alerts when critical ones are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['team', 'instance']
    
  # Suppress individual agent alerts when system-wide issues are detected
  - source_match:
      alertname: 'SystemMemoryHigh'
    target_match:
      alertname: 'AgentMemoryHigh'
    equal: ['instance']