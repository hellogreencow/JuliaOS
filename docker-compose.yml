version: '3.8'

services:
  juliaos-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: juliaos:latest
    container_name: juliaos-server
    ports:
      - "8052:8052"
    volumes:
      - julia-data:/app/data
      - .env:/app/.env:ro
    command: ["julia", "--project=/app/julia", "/app/julia/server/julia_server.jl"]
    # Add a check to verify file exists
    entrypoint: ["/bin/bash", "-c", "if [ ! -f /app/julia/server/julia_server.jl ]; then echo 'Error: julia_server.jl not found'; ls -la /app/julia/server; exit 1; fi && exec julia --project=/app/julia /app/julia/server/julia_server.jl"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8052/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  juliaos-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: juliaos:latest
    container_name: juliaos-cli
    depends_on:
      juliaos-server:
        condition: service_healthy
    volumes:
      - julia-data:/app/data
      - .env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - JULIA_SERVER_URL=http://juliaos-server:8052
      - JULIA_SERVER_HOST=juliaos-server
      - JULIA_SERVER_PORT=8052
    stdin_open: true
    tty: true
    command: ["node", "/app/packages/cli/src/interactive.cjs"]
    # Add a check to verify file exists
    entrypoint: ["/bin/bash", "-c", "if [ ! -f /app/packages/cli/src/interactive.cjs ]; then echo 'Error: interactive.cjs not found'; ls -la /app/packages/cli/src; exit 1; fi && exec node /app/packages/cli/src/interactive.cjs"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "8054:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./config/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "8055:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  julia-data:
  grafana-data:
  prometheus-data:
  loki-data:
